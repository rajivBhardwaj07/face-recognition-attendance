version: '3.9'

# ──────────────────────────────────────────────────────────────────────────────
# Smart Attendance System — Docker Compose (Local Dev)
# Usage: docker-compose up --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: attendance_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: attendance_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongo:27017/attendance_db?authSource=admin
      JWT_SECRET: super_secret_jwt_key_change_in_production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      PYTHON_SERVICE_URL: http://face_recognition:8000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Frontend (React) ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_PYTHON_API_URL: http://127.0.0.1:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  # ── Python Face Recognition ───────────────────────────────────────────────────
  face_recognition:
    build:
      context: ./face-recognition
      dockerfile: Dockerfile
    container_name: attendance_face_recognition
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:5000/api
      RECOGNITION_THRESHOLD: "0.55"
      COOLDOWN_SECONDS: "30"
    devices:
      - /dev/video0:/dev/video0   # Webcam (Linux only)
    depends_on:
      - backend
    volumes:
      - ./face-recognition:/app

volumes:
  mongo_data:
    driver: local

networks:
  default:
    name: attendance_network
